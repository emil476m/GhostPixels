[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpixels"
version = "0.1.0"
description = "Hide (and optionally encrypt) files inside images."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pillow", "platformdirs"]

[project.scripts]
ghostpixels = "ghostpixels.cli:main"
